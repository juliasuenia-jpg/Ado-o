spring.application.name=adocao

# ===== MySQL =====
# O banco "adocao" é criado automaticamente se não existir.
# Altere usuário/senha pelas variáveis de ambiente DB_USER e DB_PASSWORD (ou edite aqui).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:adocao}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Fortaleza&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== Upload de fotos dos animais =====
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ===== Dados iniciais (administrador + animais de exemplo) =====
app.seed=true
