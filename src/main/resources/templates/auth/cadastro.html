<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Criar conta')}"></head>
<body>
<header th:replace="~{fragments/layout :: topo}"></header>
<main class="estreito">
    <h1>Criar conta</h1>
    <p>Com uma conta de adotante você preenche o questionário, agenda visitas e acompanha suas solicitações.</p>
    <div th:replace="~{fragments/layout :: avisos}"></div>
    <form class="painel" th:action="@{/cadastro}" th:object="${form}" method="post">
        <div class="form-grade">
            <div class="campo largo">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" th:field="*{nome}" maxlength="120" required>
            </div>
            <div class="campo largo">
                <label for="email">E-mail</label>
                <input type="email" id="email" th:field="*{email}" maxlength="160" autocomplete="email" required>
            </div>
            <div class="campo">
                <label for="telefone">Telefone / WhatsApp</label>
                <input type="text" id="telefone" th:field="*{telefone}" maxlength="20" autocomplete="tel">
            </div>
            <div class="campo">
                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" th:field="*{cidade}" maxlength="100">
            </div>
            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" minlength="6" autocomplete="new-password" required>
                <p class="dica">Pelo menos 6 caracteres.</p>
            </div>
            <div class="campo">
                <label for="confirmarSenha">Confirmar senha</label>
                <input type="password" id="confirmarSenha" name="confirmarSenha" minlength="6" autocomplete="new-password" required>
            </div>
        </div>
        <div class="acoes-form">
            <button type="submit" class="botao botao-escuro">Criar conta</button>
        </div>
        <p class="rodape-form">Já tem conta? <a th:href="@{/login}">Entrar</a></p>
    </form>
</main>
<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
